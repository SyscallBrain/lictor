name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built book to the configured GitHub Pages site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  RUST_VERSION: 1.99.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install a pinned mdBook
        run: cargo install mdbook --version "$MDBOOK_VERSION" --locked --no-default-features --features search
      - name: Build the book
        run: mdbook build
      - name: Validate local files and anchors
        run: python3 docs/check_links.py book
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && (vars.PUBLISH_BOOK == 'true' || inputs.deploy)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.PUBLISH_BOOK == 'true' || inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
