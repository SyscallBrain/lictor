name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      # Needed only to publish the GitHub release for a version tag.
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Validate the release
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          python3 tests/cli_acceptance.py target/release/lictor
          python3 tests/controller_acceptance.py target/release/lictor
          python3 tests/lifecycle_acceptance.py target/release/lictor
      - name: Package the Linux executable
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_REF" != "v$version" ]; then
            echo "Release tag does not match Cargo.toml version" >&2
            exit 1
          fi
          package="lictor-$version-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          cp target/release/lictor LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > SHA256SUMS
      - name: Upload reviewable release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lictor-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lictor $TAG" "$@"
