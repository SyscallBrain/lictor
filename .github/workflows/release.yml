name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.0
  CARGO_DEB_VERSION: 3.8.0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      # Needed only to publish the GitHub release for a version tag.
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Validate the release
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          python3 tests/cli_acceptance.py target/release/lictor
          python3 tests/controller_acceptance.py target/release/lictor
          python3 tests/lifecycle_acceptance.py target/release/lictor
      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Install packaging tools
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked
      - name: Build the static binary and the Debian package
        run: scripts/dist.sh
      - name: Smoke-test the packages
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/lictor-*/lictor --version
          sudo apt-get install -y ./dist/*.deb
          lictor --version
          dpkg -L lictor | grep -qx /usr/share/man/man1/lictor.1.gz
          sudo apt-get remove -y lictor
      - name: Upload reviewable release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lictor-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$TAG" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lictor $TAG" "$@"
