[package]
name = "lictor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rotate Herdr focus, or mirror live terminals and coding agents side by side"
license = "MIT"
authors = ["Tiago Correia"]
repository = "https://github.com/SyscallBrain/lictor"
homepage = "https://github.com/SyscallBrain/lictor"
documentation = "https://syscallbrain.github.io/lictor/"
readme = "README.md"
keywords = ["herdr", "terminal", "tui", "ai-agents", "multiplexer"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crossterm = "0.28"
rand = "0.9"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lictor"
path = "src/main.rs"
